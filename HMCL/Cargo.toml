[package]
name = "hmcl-launcher"
edition = "2021"
version = "3.7.1"
description = "Hello Minecraft! Launcher For Windows"
license = "MIT"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_Storage",
    "Win32_Globalization",
    "Win32_System",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_UI",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation"
] }
once_cell = "1.21.3"
anyhow = "1.0.101"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.dev]
opt-level = 0